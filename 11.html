<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>兵营生成全过程演示</title>
<style>
  body{background:#111;color:#ddd;font:14px/1.6 system-ui;margin:20px}
  h1{color:#ffd23f} h3{color:#00e5ff;margin:8px 0}
  canvas{background:#1a2e1a;border:1px solid #444;border-radius:8px}
  .row{display:flex;gap:20px;flex-wrap:wrap}
  .panel{max-width:440px}
  .tag{display:inline-block;padding:2px 8px;border-radius:4px;margin-right:6px}
  .y{background:#ffd23f;color:#111} .b{background:#00e5ff;color:#111} .r{background:#ff5252;color:#fff} .o{background:#ff8f00;color:#111}
  .note{font-size:12px;color:#999}
</style>
</head>
<body>
<h1>&#127961; 兵营（barracks）生成全过程演示</h1>
<p>演示：贴图 &rarr; 底部轮廓检测 &rarr; 底边贴合 &rarr; 黄线(沿轮廓/菱形) 与 蓝线(菱形地块) 的对齐关系。</p>
<div class="row">
  <div class="panel"><h3>&#9312; 原始贴图 <span class="tag y">裁剪后</span></h3>
    <canvas id="c1" width="300" height="300"></canvas>
    <p class="note">assets/barracks.png 已裁剪到主体包围盒。红警兵营是横长建筑 &rarr; 宽&gt;高。</p>
  </div>
  <div class="panel"><h3>&#9313; 底部轮廓 bottomProfile <span class="tag r">红点</span></h3>
    <canvas id="c2" width="300" height="300"></canvas>
    <p class="note">每列最底部非透明像素（红点）。横长平底 &rarr; 轮廓近似水平线（非等距 V 形）。</p>
  </div>
  <div class="panel"><h3>&#9314; 底边贴合 + 黄/蓝线对齐 <span class="tag b">蓝=菱形</span></h3>
    <canvas id="c3" width="440" height="300"></canvas>
    <p class="note">蓝线=2&times;2 菱形地块。黄A 沿贴图轮廓=平线不对齐；黄B 菱形底边=贴合蓝线。</p>
  </div>
</div>
<script>
const TILE_W=84, TILE_H=42;
const img=new Image();
img.onload=init;
img.src='assets/barracks.png?v=2';
function bottomProfile(){
  const ow=img.naturalWidth, oh=img.naturalHeight;
  const oc=document.createElement('canvas'); oc.width=ow; oc.height=oh;
  const octx=oc.getContext('2d',{willReadFrequently:true});
  octx.drawImage(img,0,0);
  const d=octx.getImageData(0,0,ow,oh).data;
  const prof=new Array(ow);
  for(let x=0;x<ow;x++){let b=-1;for(let y=oh-1;y>=0;y--){if(d[(y*ow+x)*4+3]>8){b=y;break}}prof[x]=b<0?-1:b/oh;}
  return prof;
}
function init(){
  const prof=bottomProfile();
  const ow=img.naturalWidth, oh=img.naturalHeight;
  let pMin=null,pMax=null;
  for(let x=0;x<ow;x++){if(prof[x]<0)continue;const f=x/ow;if(pMin==null||f<pMin)pMin=f;if(pMax==null||f>pMax)pMax=f;}
  const vals=prof.filter(v=>v>=0).sort((a,b)=>a-b);
  const ratio=vals.length?vals[Math.floor(vals.length*0.95)]:1;
  const dw=Math.round(160*((2*TILE_W)/((pMax-pMin)*160)));   // 底边贴合宽
  const dh=Math.max(1,Math.round(dw*oh/ow));                 // 自然比例（不压扁）
  draw1(); draw2(prof); draw3(prof,ow,oh,dw,dh,ratio);
}
function draw1(){
  const c=document.getElementById('c1').getContext('2d');
  const s=Math.min(150/img.width,150/img.height);
  c.drawImage(img,150-img.width*s/2,150-img.height*s/2,img.width*s,img.height*s);
  c.strokeStyle='#ffd23f'; c.strokeRect(150-150/2,150-150/2,150,150);
  c.fillStyle='#ffd23f'; c.font='12px monospace';
  c.fillText(img.width+' × '+img.height+'（宽>高，横长）', 8, 16);
  c.fillText('红警兵营 = 横长平底', 8, 34);
}
function draw2(prof){
  const c=document.getElementById('c2').getContext('2d');
  const ow=img.naturalWidth, oh=img.naturalHeight;
  const s=Math.min(150/ow,150/oh);
  c.drawImage(img,150-ow*s/2,20,ow*s,oh*s);
  c.fillStyle='#ff5252';
  for(let x=0;x<ow;x++){const r=prof[x]; if(r<0)continue; c.fillRect(150-ow*s/2+x*s,20+r*oh*s,1.6,1.6);}
  c.fillStyle='#ff5252'; c.font='12px monospace';
  c.fillText('红点 = 每列底部（平底 → 近似直线）', 8, 285);
}
function draw3(prof,ow,oh,dw,dh,ratio){
  const c=document.getElementById('c3').getContext('2d');
  const cx=220, gy=262;   // 地面菱形下角尖
  // 蓝线：菱形地块（2×2）
  c.save(); c.setLineDash([8,5]); c.strokeStyle='#00e5ff'; c.lineWidth=5; c.lineJoin='round';
  c.beginPath(); c.moveTo(cx-TILE_W,gy-TILE_H); c.lineTo(cx,gy); c.lineTo(cx+TILE_W,gy-TILE_H); c.stroke(); c.restore();
  // 贴图（底边贴合：底部两端对准菱形左右角）
  const topY=gy-ratio*dh;
  c.save(); c.globalAlpha=0.9; c.drawImage(img,cx-dw/2,topY,dw,dh); c.restore();
  // 黄线A：沿贴图底部轮廓（平线，不对齐 V 形）
  c.save(); c.setLineDash([6,4]); c.strokeStyle='#ffd23f'; c.lineWidth=3;
  c.beginPath(); let st=false;
  for(let x=0;x<ow;x++){const r=prof[x]; if(r<0)continue; const sx=cx-dw/2+(x/ow)*dw; const sy=topY+Math.min(r,ratio)*dh; if(!st){c.moveTo(sx,sy);st=true}else c.lineTo(sx,sy);}
  c.stroke(); c.restore();
  // 黄线B：菱形底边（贴合蓝线）
  c.save(); c.setLineDash([6,4]); c.strokeStyle='#ff8f00'; c.lineWidth=4; c.lineJoin='round';
  c.beginPath(); c.moveTo(cx-TILE_W,gy-TILE_H); c.lineTo(cx,gy); c.lineTo(cx+TILE_W,gy-TILE_H); c.stroke(); c.restore();
  // 图例
  c.font='12px monospace';
  c.fillStyle='#00e5ff'; c.fillText('蓝线 = 菱形地块（2×2 底边）', 8, 18);
  c.fillStyle='#ffd23f'; c.fillText('黄A = 沿贴图底部轮廓（平线 → 不对齐）', 8, 36);
  c.fillStyle='#ff8f00'; c.fillText('黄B = 菱形底边（贴合蓝线）✓ 修复方案', 8, 54);
  c.fillStyle='#999'; c.fillText('dw='+dw+'  dh='+dh+'  bottomRatio='+ratio.toFixed(2), 8, 292);
}
</script>
</body></html>
