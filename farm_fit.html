<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>农场贴图 · 四顶点自由变换</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#14141f; color:#e8e8f0; font-family:"Segoe UI",system-ui,sans-serif; }
  #wrap { display:flex; gap:14px; padding:14px; align-items:flex-start; flex-wrap:wrap; }
  #stage { display:flex; flex-direction:column; gap:10px; }
  canvas { border:1px solid #3a3a52; background:
    repeating-conic-gradient(#262638 0% 25%, #1e1e2e 0% 50%) 0 0 / 24px 24px; cursor:crosshair; }
  #tile { background:#1d1d30; cursor:default; }
  #panel { width:330px; }
  #panel h3 { margin:4px 0 8px; font-size:15px; color:#8fd3ff; }
  .row { font-size:12px; margin:3px 0; }
  .dot { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  button { margin:6px 4px 0 0; padding:7px 12px; border:0; border-radius:6px; background:#2f6fd0; color:#fff; cursor:pointer; font-size:13px; }
  button:hover { background:#3a7fe8; }
  #coords { margin-top:8px; font-size:12px; color:#ffd23f; white-space:pre-line; background:#1d1d30; padding:8px; border-radius:6px; }
  #saveMsg { margin-top:6px; font-size:13px; min-height:18px; }
  #saveMsg.ok { color:#6dff52; }
  #saveMsg.err { color:#ff5252; }
  #help { margin-top:10px; font-size:12px; color:#9aa0b5; line-height:1.7; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
  </div>
  <div id="panel">
    <h3>四个顶点（PNG 内容检测，可拖动）</h3>
    <div class="row"><span class="dot" style="background:#ff5252"></span>上角（红）</div>
    <div class="row"><span class="dot" style="background:#52d0ff"></span>右角（青）</div>
    <div class="row"><span class="dot" style="background:#6dff52"></span>下角（绿）</div>
    <div class="row"><span class="dot" style="background:#ffd23f"></span>左角（黄）</div>
    <button id="redetect">重新检测四角</button>
    <button id="reset">重置为检测结果</button>
    <button id="save">💾 保存四角</button>
    <div id="saveMsg"></div>
    <div id="coords"></div>
    <div id="help">
      按 PNG 内容（非透明像素）自动找出四个尖角（上/右/下/左），不是 JPG 矩形的四个角。<br>
      拖动色点自由移动四角，图片实时按四角做网格变形预览。<br>
      坐标 = 相对图片像素；括号内 0~1 为归一化（0=左/上，1=右/下）。
    </div>
  </div>
</div>
<script>
const img = new Image();
img.src = 'assets/farm.png';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
let pts = [];            // [top, right, bottom, left] 图片像素坐标
let base = [];           // 检测结果（用于重置）
let drag = -1;
const COLORS = ['#ff5252', '#52d0ff', '#6dff52', '#ffd23f'];
const NAMES = ['上', '右', '下', '左'];

img.onload = () => {
  W = img.naturalWidth; H = img.naturalHeight;
  cv.width = W; cv.height = H;
  detect();
  cv.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', () => { drag = -1; });
  draw();
};

// —— 按 PNG 内容（非透明像素）检测四个尖角 ——
function detect() {
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, W, H).data;
  const col = x => { let lo = H, hi = -1; for (let y = 0; y < H; y++) if (d[(y * W + x) * 4 + 3] > 30) { if (y < lo) lo = y; if (y > hi) hi = y; } return lo <= hi ? (lo + hi) / 2 : -1; };
  const row = y => { let lo = W, hi = -1; for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 30) { if (x < lo) lo = x; if (x > hi) hi = x; } return lo <= hi ? (lo + hi) / 2 : -1; };
  let minY = H, maxY = -1, minX = W, maxX = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
    if (d[(y * W + x) * 4 + 3] > 30) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  pts = [
    [row(minY), minY],   // 上角：最上行内容中点
    [maxX, col(maxX)],   // 右角：最右列内容中点
    [row(maxY), maxY],   // 下角：最下行内容中点
    [minX, col(minX)],   // 左角：最左列内容中点
  ];
  base = pts.map(p => p.slice());
}

// —— 双线性：u 左→右(0..1)，v 上→下(0..1) ——
function P(u, v) {
  const A = pts[0], B = pts[1], C = pts[2], D = pts[3];
  return [
    (1 - u) * (1 - v) * A[0] + u * (1 - v) * B[0] + u * v * C[0] + (1 - u) * v * D[0],
    (1 - u) * (1 - v) * A[1] + u * (1 - v) * B[1] + u * v * C[1] + (1 - u) * v * D[1],
  ];
}
// 源位置：初始检测的内容菱形四角（拖动前），图片内容从这四角变形到当前四角
function Psrc(u, v) {
  const A = base[0], B = base[1], C = base[2], D = base[3];
  return [
    (1 - u) * (1 - v) * A[0] + u * (1 - v) * B[0] + u * v * C[0] + (1 - u) * v * D[0],
    (1 - u) * (1 - v) * A[1] + u * (1 - v) * B[1] + u * v * C[1] + (1 - u) * v * D[1],
  ];
}

function drawTri(s, d) {
  const ux = s[1][0] - s[0][0], uy = s[1][1] - s[0][1], vx = s[2][0] - s[0][0], vy = s[2][1] - s[0][1];
  const den = ux * vy - vx * uy; if (!den) return;
  const wux = d[1][0] - d[0][0], wuy = d[1][1] - d[0][1], wvx = d[2][0] - d[0][0], wvy = d[2][1] - d[0][1];
  const a = (wux * vy - wvx * uy) / den, c = (wvx * ux - wux * vx) / den;
  const b = (wuy * vy - wvy * uy) / den, dd = (wvy * ux - wuy * vx) / den;
  const e = d[0][0] - a * s[0][0] - c * s[0][1], f = d[0][1] - b * s[0][0] - dd * s[0][1];
  ctx.save();
  ctx.beginPath(); ctx.moveTo(d[0][0], d[0][1]); ctx.lineTo(d[1][0], d[1][1]); ctx.lineTo(d[2][0], d[2][1]); ctx.closePath();
  ctx.clip();
  ctx.transform(a, b, c, dd, e, f);
  ctx.drawImage(img, 0, 0, W, H);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  // —— 底层：游戏 2:1 地块草块（固定参照，叠在图片下面）——
  const cx0 = (base[1][0] + base[3][0]) / 2;
  const cy0 = (base[0][1] + base[2][1]) / 2;
  const hw0 = Math.max(base[1][0] - base[3][0], 10) / 2;
  const hh0 = hw0 / 2;
  ctx.fillStyle = 'rgba(77,122,52,0.5)';
  ctx.beginPath();
  ctx.moveTo(cx0, cy0 - hh0); ctx.lineTo(cx0 + hw0, cy0); ctx.lineTo(cx0, cy0 + hh0); ctx.lineTo(cx0 - hw0, cy0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#79b347'; ctx.lineWidth = 2; ctx.stroke();
  const gv = [[cx0, cy0 - hh0], [cx0 + hw0, cy0], [cx0, cy0 + hh0], [cx0 - hw0, cy0]];
  gv.forEach((p, i) => {
    ctx.beginPath(); ctx.arc(p[0], p[1], 5, 0, Math.PI * 2);
    ctx.fillStyle = COLORS[i]; ctx.fill();
  });
  // —— 图片：从初始菱形平滑变形到当前四角（拖动实时跟随），半透明露出下面草块 ——
  ctx.save();
  ctx.globalAlpha = 0.85;
  const N = 24;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const u0 = i / N, v0 = j / N, u1 = (i + 1) / N, v1 = (j + 1) / N;
    const s00 = Psrc(u0, v0), s10 = Psrc(u1, v0), s11 = Psrc(u1, v1), s01 = Psrc(u0, v1);
    const d00 = P(u0, v0), d10 = P(u1, v0), d11 = P(u1, v1), d01 = P(u0, v1);
    drawTri([s00, s10, s11], [d00, d10, d11]);
    drawTri([s00, s11, s01], [d00, d11, d01]);
  }
  ctx.restore();
  // 顶点标记 + 十字
  pts.forEach((p, i) => {
    ctx.beginPath(); ctx.arc(p[0], p[1], 9, 0, Math.PI * 2);
    ctx.fillStyle = COLORS[i]; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p[0] - 15, p[1]); ctx.lineTo(p[0] + 15, p[1]);
    ctx.moveTo(p[0], p[1] - 15); ctx.lineTo(p[0], p[1] + 15);
    ctx.lineWidth = 2; ctx.strokeStyle = COLORS[i]; ctx.stroke();
  });
  // 坐标
  let s = '';
  pts.forEach((p, i) => {
    s += NAMES[i] + '角: (' + Math.round(p[0]) + ', ' + Math.round(p[1]) + ')  = (' + (p[0] / W).toFixed(3) + ', ' + (p[1] / H).toFixed(3) + ')\n';
  });
  document.getElementById('coords').textContent = s;
}

function onDown(e) {
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (W / r.width), my = (e.clientY - r.top) * (H / r.height);
  let best = -1, bd = 1e9;
  pts.forEach((p, i) => { const dd = Math.hypot(p[0] - mx, p[1] - my); if (dd < bd) { bd = dd; best = i; } });
  if (bd < 30) drag = best;
}
function onMove(e) {
  if (drag < 0) return;
  const r = cv.getBoundingClientRect();
  const mx = Math.max(0, Math.min(W, (e.clientX - r.left) * (W / r.width)));
  const my = Math.max(0, Math.min(H, (e.clientY - r.top) * (H / r.height)));
  pts[drag] = [mx, my];
  draw();
}
document.getElementById('redetect').onclick = () => { detect(); draw(); };
document.getElementById('reset').onclick = () => { pts = base.map(p => p.slice()); draw(); };
// —— 保存：写浏览器本地(localStorage，同源8090游戏直接读) + ajax写后端文件，双保险 ——
const saveMsg = document.getElementById('saveMsg');
document.getElementById('save').onclick = () => {
  saveMsg.className = ''; saveMsg.textContent = '保存中…';
  const data = { top: pts[0], right: pts[1], bottom: pts[2], left: pts[3], w: W, h: H };
  let okLs = false;
  try { localStorage.setItem('farm_corners', JSON.stringify(data)); okLs = true; } catch (e) {}
  fetch('http://localhost:8099/coords', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  })
    .then(r => r.json())
    .then(() => {
      saveMsg.className = 'ok';
      saveMsg.textContent = '✓ 已保存 本地' + (okLs ? '✓' : '✗') + ' + 文件✓  ' + new Date().toLocaleTimeString();
    })
    .catch(() => {
      if (okLs) { saveMsg.className = 'ok'; saveMsg.textContent = '✓ 已存浏览器本地（后端未连，游戏刷新仍生效）'; }
      else { saveMsg.className = 'err'; saveMsg.textContent = '✗ 保存失败'; }
    });
};
</script>
</body>
</html>
