<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>建筑下角微调</title>
<style>
  body{background:#111a26;color:#ddd;font:14px/1.6 system-ui;margin:20px}
  h1{color:#ffd23f;margin-bottom:4px}
  .hint{color:#9ab;margin-top:0}
  .menu{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0;max-height:120px;overflow:auto}
  .menu button{background:#1c2a3d;border:1px solid #2a3550;color:#cfd;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  .menu button.active{background:#ffd23f;color:#111a26;border-color:#ffd23f}
  .stage{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
  .card{background:#182434;border:1px solid #2a3550;border-radius:12px;padding:14px}
  .card canvas{width:460px;height:350px;background:#2f7a3a;border-radius:8px;display:block}
  .card .name{color:#fff;font-weight:600;margin:10px 0 8px}
  .card .ctrl{display:flex;align-items:center;gap:10px}
  .card input[type=range]{flex:1}
  .card .val{width:44px;text-align:right;color:#ffd23f;font:bold 14px monospace}
  .legend{font-size:12px;color:#9ab;margin-top:8px}
  .toolbar{margin:16px 0}
  .btn{padding:10px 24px;border:none;border-radius:8px;font-size:14px;cursor:pointer;margin-right:8px}
  .save{background:#ffd23f;color:#111a26} .reset{background:#4a5a7a;color:#fff}
  .note{font-size:12px;color:#7a88a0}
</style>
</head>
<body>
<h1>&#127961; 建筑下角角度微调（完全复刻游戏场景）</h1>
<p class="hint">顶部菜单切换建筑。场景与游戏完全一致：草绿菱形网格 + 2×2 地块 + 建筑按游戏底边贴合贴地放置 + 蓝线(青)与黄线菱形（自动贴合），拖动滑杆微调<b>最下面这个角</b>（正=更深，负=更浅）。保存后回游戏<b>强刷（Ctrl+Shift+R）</b>生效。</p>
<div class="menu" id="menu"></div>
<div class="stage">
  <div class="card">
    <canvas id="scene" width="460" height="350"></canvas>
    <div class="name" id="name">—</div>
    <div class="ctrl">
      <span style="color:#9ab">下角偏移</span>
      <input type="range" id="slider" min="-40" max="40" step="1" value="0">
      <span class="val" id="val">0</span>
    </div>
    <div class="legend">
      <span style="color:#00e5ff">蓝线=2×2 地块底边</span> &nbsp;|&nbsp;
      <span style="color:#ffd23f">黄线=菱形（自动贴合蓝线）</span>
    </div>
  </div>
  <div class="toolbar">
    <button class="btn save" onclick="save()">保存</button>
    <button class="btn reset" onclick="resetAll()">全部重置</button>
    <p class="note" style="margin-top:10px">配置存于 localStorage（cornerTweak），仅本机生效。</p>
  </div>
</div>
<script src="content.js"></script>
<script>
(function(){
  const D = window.Content && window.Content.BUILD_DEFS;
  const KEY = 'cornerTweak';
  if (!D) { document.body.innerHTML = '<p style="color:#ff6b6b">content.js 未加载（请通过 localhost 访问）</p>'; return; }
  // ===== 游戏参数（与 game.js 完全一致）=====
  const TILE_W = 84, TILE_H = 42;
  const IMGS = {};
  // 加载贴图 + 计算底部轮廓（滤噪点，同游戏 computeBottom）
  function loadImgs(cb){
    const keys = Object.keys(D); let n = 0;
    keys.forEach(k => {
      const img = new Image();
      img.onload = () => {
        const ow = img.naturalWidth, oh = img.naturalHeight;
        try {
          const oc = document.createElement('canvas'); oc.width=ow; oc.height=oh;
          const octx = oc.getContext('2d', { willReadFrequently: true });
          octx.drawImage(img, 0, 0);
          const d = octx.getImageData(0,0,ow,oh).data;
          const prof = new Array(ow); const bottoms = [];
          for(let x=0;x<ow;x++){let b=-1;
            for(let y=oh-1;y>=0;y--){
              if(d[(y*ow+x)*4+3]>8){
                const up=y>0&&d[((y-1)*ow+x)*4+3]>8, dn=y<oh-1&&d[((y+1)*ow+x)*4+3]>8;
                const lf=x>0&&d[(y*ow+x-1)*4+3]>8, rt=x<ow-1&&d[(y*ow+x+1)*4+3]>8;
                if(up||dn||lf||rt){b=y;break}
              }
            }
            prof[x]=b<0?-1:b/oh;
            if(b>=0)bottoms.push(b/oh);
          }
          bottoms.sort((a,b)=>a-b);
          const ratio = bottoms.length ? bottoms[Math.floor(bottoms.length*0.95)] : 1;
          let pMin=null,pMax=null;
          for(let x=0;x<ow;x++){if(prof[x]<0)continue;const f=x/ow;if(pMin==null||f<pMin)pMin=f;if(pMax==null||f>pMax)pMax=f;}
          img._bp = { prof, pMin: Math.max(0,pMin), pMax: Math.min(1,pMax), ratio };
          img._corners = detectCorners(img);
        } catch(e){ img._bp = null; img._corners = null; }
        IMGS[k] = img;
        if(++n===keys.length) cb();
      };
      img.onerror = () => { if(++n===keys.length) cb(); };
      img.src = 'assets/' + (D[k].image || k) + '.png';
    });
  }
  // 检测贴图内容菱形四角（同游戏 detectFarmCorners）
  function detectCorners(img){
    const W = img.naturalWidth, H = img.naturalHeight;
    if (!W || !H) return null;
    const cv2 = document.createElement('canvas'); cv2.width = W; cv2.height = H;
    const g = cv2.getContext('2d'); g.drawImage(img, 0, 0);
    let d; try { d = g.getImageData(0,0,W,H).data; } catch(e) { return null; }
    const col = x => { let lo=H,hi=-1; for(let y=0;y<H;y++) if(d[(y*W+x)*4+3]>30){ if(y<lo)lo=y; if(y>hi)hi=y; } return lo<=hi?(lo+hi)/2:-1; };
    const row = y => { let lo=W,hi=-1; for(let x=0;x<W;x++) if(d[(y*W+x)*4+3]>30){ if(x<lo)lo=x; if(x>hi)hi=x; } return lo<=hi?(lo+hi)/2:-1; };
    let minY=H,maxY=-1,minX=W,maxX=-1;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++) if(d[(y*W+x)*4+3]>30){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
    if(minX>maxX||minY>maxY) return null;
    return { top:[row(minY)/W,minY/H], right:[maxX/W,col(maxX)/H], bottom:[row(maxY)/W,maxY/H], left:[minX/W,col(minX)/H] };
  }
  // 透视变换（同游戏 drawPerspective）：贴图内容菱形四角 → 目标菱形四角，corner 调下角
  function drawPerspective(c, img, FC, dst, N){
    const ow0=img.naturalWidth, oh0=img.naturalHeight;
    const A={x:FC.top[0]*ow0,y:FC.top[1]*oh0}, B={x:FC.right[0]*ow0,y:FC.right[1]*oh0};
    const C={x:FC.bottom[0]*ow0,y:FC.bottom[1]*oh0}, Dd={x:FC.left[0]*ow0,y:FC.left[1]*oh0};
    const Src=(u,v)=>({x:(1-u)*(1-v)*A.x+u*(1-v)*B.x+u*v*C.x+(1-u)*v*Dd.x, y:(1-u)*(1-v)*A.y+u*(1-v)*B.y+u*v*C.y+(1-u)*v*Dd.y});
    const Dst=(u,v)=>({x:(1-u)*(1-v)*dst.U.x+u*(1-v)*dst.R.x+u*v*dst.D.x+(1-u)*v*dst.L.x, y:(1-u)*(1-v)*dst.U.y+u*(1-v)*dst.R.y+u*v*dst.D.y+(1-u)*v*dst.L.y});
    const drawTri=(s,d)=>{
      const ux=s[1].x-s[0].x,uy=s[1].y-s[0].y,vx=s[2].x-s[0].x,vy=s[2].y-s[0].y;
      const den=ux*vy-vx*uy; if(!den)return;
      const wux=d[1].x-d[0].x,wuy=d[1].y-d[0].y,wvx=d[2].x-d[0].x,wvy=d[2].y-d[0].y;
      const a=(wux*vy-wvx*uy)/den,mc=(wvx*ux-wux*vx)/den,b=(wuy*vy-wvy*uy)/den,dd=(wvy*ux-wuy*vx)/den;
      const e=d[0].x-a*s[0].x-mc*s[0].y,f=d[0].y-b*s[0].x-dd*s[0].y;
      c.save(); c.beginPath(); c.moveTo(d[0].x,d[0].y); c.lineTo(d[1].x,d[1].y); c.lineTo(d[2].x,d[2].y); c.closePath(); c.clip();
      c.transform(a,b,mc,dd,e,f); c.drawImage(img,0,0,ow0,oh0); c.restore();
    };
    const n=N||16;
    for(let j=0;j<n;j++)for(let i=0;i<n;i++){
      const u0=i/n,v0=j/n,u1=(i+1)/n,v1=(j+1)/n;
      const s00=Src(u0,v0),s10=Src(u1,v0),s11=Src(u1,v1),s01=Src(u0,v1);
      const d00=Dst(u0,v0),d10=Dst(u1,v0),d11=Dst(u1,v1),d01=Dst(u0,v1);
      drawTri([s00,s10,s11],[d00,d10,d11]); drawTri([s00,s11,s01],[d00,d11,d01]);
    }
  }
  function pathDiamond(c,px,py,tw,th){
    c.beginPath(); c.moveTo(px,py); c.lineTo(px+tw/2,py+th/2); c.lineTo(px,py+th); c.lineTo(px-tw/2,py+th/2); c.closePath();
  }
  // 菱形地块（蓝线）与黄线：完全复刻游戏（左角→下角+corner→右角）
  function drawDiamond(c, cx, groundY, tw, th, corner, color, dash, lw){
    c.save(); c.setLineDash(dash); c.strokeStyle=color; c.lineWidth=lw; c.lineJoin='round';
    c.beginPath();
    c.moveTo(cx-tw, groundY-th);          // 左角 = (p.x-TILE_W, p.y+TILE_H)
    c.lineTo(cx, groundY+corner);         // 下角尖 = groundY + corner
    c.lineTo(cx+tw, groundY-th);          // 右角
    c.stroke(); c.restore();
  }
  let current = null;
  function drawScene(k, corner){
    const cv = document.getElementById('scene');
    const c = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    c.clearRect(0,0,W,H);
    // 草地背景
    c.fillStyle = '#2f7a3a'; c.fillRect(0,0,W,H);
    // 缩放：游戏 2×2 建筑底边 168px 宽 → 适配画布
    const sc = Math.min((W-90)/168, (H-60)/120);
    const tw = TILE_W*sc, th = TILE_H*sc;
    const cx = W/2, py = H*0.48;
    const groundY = py + 2*th;            // 游戏：p.y + bsize*TILE_H（2×2）
    // 草地菱形网格（等距，同游戏瓦片）
    c.strokeStyle = 'rgba(0,0,0,0.10)'; c.lineWidth = 1;
    for(let gx=-4;gx<=5;gx++)for(let gy=-4;gy<=5;gy++){
      const px = cx+(gx-gy)*tw/2, py2 = H-12+(gx+gy)*th/2;
      c.beginPath(); c.moveTo(px,py2); c.lineTo(px+tw/2,py2+th/2); c.lineTo(px,py2+th); c.lineTo(px-tw/2,py2+th/2); c.closePath(); c.stroke();
    }
    const img = IMGS[k];
    if(!img || !img.width){ c.fillStyle='#9ab'; c.font='14px system-ui'; c.textAlign='center'; c.fillText('贴图加载中…', W/2, H/2); return; }
    const ow = img.naturalWidth, oh = img.naturalHeight;
    const bp = img._bp;
    // 底边贴合（同游戏）：dw 由底边轮廓两端对齐菱形左右角；dh 自然比例
    let dw = 2*tw, dh = dw;
    if(bp && bp.pMax > bp.pMin){
      dw = Math.round(160 * ((2*TILE_W) / ((bp.pMax-bp.pMin)*160))) * sc;
      dh = Math.max(1, Math.round(dw * oh / ow));
    }
    const ratio = bp ? bp.ratio : 1;
    const topY = groundY - ratio*dh;      // 贴图底部贴地（不浮空，同游戏）
    // 蓝线（固定地块菱形，不随 corner）
    drawDiamond(c, cx, groundY, tw, th, 0, '#00e5ff', [8,5], 3);
    // 贴图（建筑站立绘制，游戏源码：底边贴合，不压平贴地）
    c.drawImage(img, cx-dw/2, topY, dw, dh);
    // 黄线（贴图底部 V 形夹角，随 corner 显示透视角度）
    c.save(); c.setLineDash([5,3]); c.strokeStyle='#ffd23f'; c.lineWidth=3; c.lineJoin='round';
    c.beginPath();
    c.moveTo(cx-dw/2, groundY);
    c.lineTo(cx, groundY+corner);
    c.lineTo(cx+dw/2, groundY);
    c.stroke(); c.restore();
  }
  // 菜单
  const menu = document.getElementById('menu');
  const keys = Object.keys(D);
  keys.forEach(k => {
    const b = document.createElement('button');
    b.textContent = D[k].icon + ' ' + D[k].name;
    b.dataset.k = k;
    b.onclick = () => select(k);
    menu.appendChild(b);
  });
  let saved = {};
  // 基础值来自 config.ini（持久化文件），localStorage 插件配置（kairo_plugin）覆盖
  function loadSaved(cb){
    const apply = (base) => {
      saved = base || {};
      try {
        const plug = JSON.parse(localStorage.getItem('kairo_plugin') || '{}');
        if (plug && plug.data && plug.data.building_perspective)
          for (const k in plug.data.building_perspective) saved[k] = plug.data.building_perspective[k].corner || 0;
        const ls = JSON.parse(localStorage.getItem('cornerTweak') || '{}');   // 兼容旧 key
        for (const k in ls) if (saved[k] == null) saved[k] = ls[k];
      } catch(e){}
      cb();
    };
    if (typeof fetch !== 'undefined') {
      fetch('config.ini', { cache: 'no-store' })
        .then(r => r.ok ? r.text() : '')
        .then(txt => {
          const t = {}; let inC = false;
          for (const line of txt.split('\n')) {
            const s = line.trim();
            if (!s || s[0]===';' || s[0]==='#') continue;
            if (s[0]==='[') { inC = (s==='[corner]'); continue; }
            if (!inC) continue;
            const i = s.indexOf('=');
            if (i>0){ const v = parseInt(s.slice(i+1).trim(),10); if (!isNaN(v) && v) t[s.slice(0,i).trim()] = v; }
          }
          apply(t);
        })
        .catch(() => apply(null));
    } else apply(null);
  }
  const slider = document.getElementById('slider');
  function select(k){
    current = k;
    document.querySelectorAll('#menu button').forEach(b => b.classList.toggle('active', b.dataset.k === k));
    document.getElementById('name').textContent = D[k].icon + ' ' + D[k].name + '（' + k + '）';
    slider.value = saved[k] || 0;
    document.getElementById('val').textContent = slider.value;
    drawScene(k, parseInt(slider.value,10)||0);
  }
  slider.addEventListener('input', function(){
    document.getElementById('val').textContent = slider.value;
    if (current) drawScene(current, parseInt(slider.value,10)||0);
  });
  loadImgs(() => { loadSaved(() => { select(keys[0]); }); });
  window.save = function(){
    // 收集所有建筑当前值（当前滑杆 + 已保存）
    const t = {};
    if (current) { const v = parseInt(slider.value,10); if (v) t[current] = v; }
    for (const k in saved) if (t[k] == null) t[k] = saved[k];
    saved = t;
    // 1) 写入插件配置 localStorage['kairo_plugin'] → 游戏插件入口每0.5s检测版本戳更新 → 渲染响应
    const plug = { v: Date.now(), data: { building_perspective: {} } };
    for (const k in t) plug.data.building_perspective[k] = { corner: t[k] };
    localStorage.setItem('kairo_plugin', JSON.stringify(plug));
    // 2) 生成 config.ini 并下载（持久化到游戏目录，随项目提交）
    let txt = '; ============================================================\n'
      + '; 冒险村物语 - 建筑透视插件配置（tweak.html 保存生成）\n'
      + '; 游戏启动时读取（fetch config.ini），无需改代码\n'
      + '; 格式：建筑key=偏移px（正=下角更深/更尖，负=更浅/更平，0=默认）\n'
      + '; ============================================================\n[corner]\n';
    keys.forEach(k => { txt += k + '=' + (t[k] || 0) + '\n'; });
    const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'config.ini';
    document.body.appendChild(a); a.click(); a.remove();
    alert('已保存为插件配置：\n1) localStorage[kairo_plugin] 已写入——游戏约0.5秒内热更新渲染（无需刷新）；\n2) config.ini 已下载——保存到游戏目录覆盖可持久化。');
  };
  window.resetAll = function(){ localStorage.removeItem('kairo_plugin'); localStorage.removeItem('cornerTweak'); location.reload(); };
})();
</script>
</body>
</html>
